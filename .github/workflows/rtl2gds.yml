# =====================================================================
#  EEE703128 - RTL-to-GDSII trên GitHub Actions (Cổng A) - Full Pipeline
# =====================================================================
name: RTL to GDSII & Verification Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MA_DE: B06
  DESIGN_NAME: b06_hamming74_encoder
  CONFIG: config.json

jobs:
  mo-phong:
    name: 1 - Mô phỏng RTL (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Ghi lại phiên bản công cụ
        run: |
          iverilog -V | head -1 | tee tool_versions.txt
          echo "Ngày chạy: $(date -Is)" | tee -a tool_versions.txt

      - name: Biên dịch và chạy testbench
        run: |
          iverilog -g2012 -o sim.vvp src/project.v test/b06_reference.sv test/tb_rtl.v
          vvp sim.vvp | tee simulation.log

      - name: Kiểm tra log - phải có PASS và không được có lỗi
        run: |
          if grep -qiE "FATAL|mismatch|\bFAIL\b" simulation.log; then
            echo "::error::Testbench báo lỗi - xem simulation.log"
            exit 1
          fi
          if ! grep -qi "PASS" simulation.log; then
            echo "::error::Không thấy dòng PASS nào trong log"
            exit 1
          fi
          echo "Mô phỏng đạt."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mo-phong-${{ env.MA_DE }}
          path: |
            simulation.log
            tool_versions.txt
            *.vcd
          if-no-files-found: warn

  rtl2gds:
    name: 2 - RTL-to-GDSII (LibreLane + sky130A)
    runs-on: ubuntu-latest
    needs: mo-phong
    steps:
      - uses: actions/checkout@v4

      - name: Cài Nix kèm bộ nhớ đệm nhị phân của FOSSi
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Lấy LibreLane
        run: git clone --depth 1 https://github.com/librelane/librelane ~/librelane

      - name: Chạy flow
        run: |
          cd ~/librelane
          nix-shell --run "cd '$GITHUB_WORKSPACE' && librelane --version && librelane '$CONFIG'"

      - name: Kiểm tra sản phẩm
        run: |
          GDS=$(find . -name "*.gds" | head -1)
          MJ=$(find . -name "metrics.json" | head -1)
          if [ -z "$GDS" ]; then echo "::error::Không sinh được file GDS"; exit 1; fi
          if [ -z "$MJ" ];  then echo "::error::Không có metrics.json";    exit 1; fi
          echo "GDS: $GDS"
          echo "--- Chỉ số chính ---"
          python3 .github/doc_metrics.py "$MJ"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl2gds-${{ env.MA_DE }}
          path: |
            **/runs/**/final/**
            **/runs/**/*.log
            **/metrics.json
            **/*.gds
          if-no-files-found: warn

  package_gds:
    name: Package GDS and gate-level netlist
    needs: rtl2gds
    runs-on: ubuntu-latest
    steps:
      - name: Download RTL-to-GDS artifact
        uses: actions/download-artifact@v4
        with:
          name: rtl2gds-${{ env.MA_DE }}
          path: output_gds

      - name: Prepare Tiny Tapeout submission
        shell: bash
        run: |
          set -euo pipefail
          GDS="$(find output_gds -type f -path '*/final/gds/tt_um_eee703128_24100688.gds' -print -quit)"
          PNL="$(find output_gds -type f -path '*/final/pnl/tt_um_eee703128_24100688.pnl.v' -print -quit)"
          if [ -z "$GDS" ] || [ -z "$PNL" ]; then
            echo "::error::Không tìm thấy GDS cuối cùng hoặc PNL netlist."
            find output_gds -type f \( -name '*.gds' -o -name '*.pnl.v' \) -print
            exit 1
          fi
          mkdir -p tt_submission
          cp "$GDS" tt_submission/tt_um_eee703128_24100688.gds
          cp "$PNL" tt_submission/tt_um_eee703128_24100688.v
          echo "B06 final GDS artifact" > viewer-artifact-root.txt
          ls -lh tt_submission/

      - name: Install KLayout
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y klayout
          klayout -v

      - name: Render PNG from the real GDS
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/render_klayout.rb <<'RUBY'
          gds = ENV.fetch("GDS")
          png = ENV.fetch("PNG")
          layout = RBA::Layout.new
          layout.read(gds)
          view = RBA::LayoutView.new
          view.load_layout(gds, 0)
          view.max_hier
          view.zoom_fit
          view.save_image(png, 1200, 900)
          puts "Rendered #{png}; cells=#{layout.cells.size}"
          RUBY
          GDS="$GITHUB_WORKSPACE/tt_submission/tt_um_eee703128_24100688.gds" \
          PNG="$GITHUB_WORKSPACE/gds_render.png" \
            klayout -b -r /tmp/render_klayout.rb
          file gds_render.png
          test -s gds_render.png

      - name: Upload submission for official checks and viewer
        uses: actions/upload-artifact@v4
        with:
          name: tt_submission
          path: |
            tt_submission/*.gds
            tt_submission/*.v
            viewer-artifact-root.txt
          if-no-files-found: error

      - name: Upload rendered layout image
        uses: actions/upload-artifact@v4
        with:
          name: gds_render
          path: gds_render.png
          if-no-files-found: error

  precheck:
    name: 3 - Official Tiny Tapeout Precheck
    needs: package_gds
    runs-on: ubuntu-latest
    steps:
      - name: Run official Tiny Tapeout precheck
        uses: TinyTapeout/tt-gds-action/precheck@b4ed4cf85a92075809d998d04c275ec00e64c8c8
        with:
          pdk: sky130
          tools-ref: ttsky25b

  gl_test:
    name: 4 - Official Gate-Level Simulation
    needs: package_gds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run official Tiny Tapeout gate-level test
        uses: TinyTapeout/tt-gds-action/gl_test@b4ed4cf85a92075809d998d04c275ec00e64c8c8
        with:
          pdk: sky130

  viewer:
    name: 5 - Real Tiny Tapeout Layout Viewer
    if: github.event_name != 'pull_request'
    needs: [precheck, gl_test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy actual Tiny Tapeout Viewer
        uses: TinyTapeout/tt-gds-action/viewer@b4ed4cf85a92075809d998d04c275ec00e64c8c8
        with:
          pdk: sky130
