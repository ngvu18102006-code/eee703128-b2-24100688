# =====================================================================
#  EEE703128 - RTL-to-GDSII tren GitHub Actions
#
#  DAY LA CONG A: bai nop phai co repo ca nhan + lich su commit + link
#  den mot lan chay CI. Thieu la khong duoc cham tiep.
#
#  CACH DUNG
#   1. Tao repo ca nhan. De private cung duoc, nho them giang vien lam
#      collaborator de cham.
#   2. Chep file nay vao dung duong dan  .github/workflows/rtl2gds.yml
#   3. Sua ba bien trong muc `env` ben duoi cho khop de cua minh.
#   4. Commit va push. Vao tab "Actions" de xem no chay.
#   5. Chay xong, bam vao lan chay do de lay LINK - do la link CI phai nop.
#
#  Flow chay tren may cua GitHub chu khong phai may minh, nen ket qua o
#  day la bang chung khach quan: ai bam vao link cung chay lai duoc.
# =====================================================================
name: RTL to GDSII

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # ---- SUA BA DONG NAY CHO KHOP DE CUA MINH -----------------------
  MA_DE: B06
  DESIGN_NAME: tt_um_eee703128_24100688
  CONFIG: config.json
  # -----------------------------------------------------------------

jobs:
  precheck:
    name: 0 - Precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiem tra cac file bat buoc
        run: |
          set -eu
          test -f config.json
          test -f src/project.v
          test -f test/tb.v
          test -f test/b06_reference.sv
          test -f .github/doc_metrics.py

          python3 - <<'PY'
          import json

          with open("config.json", encoding="utf-8") as f:
              config = json.load(f)

          expected = "tt_um_eee703128_24100688"
          actual = config.get("DESIGN_NAME")

          if actual != expected:
              raise SystemExit(
                  f"DESIGN_NAME sai: {actual!r}; mong doi {expected!r}"
              )

          print("PRECHECK PASS")
          PY
  mo-phong:
    name: 1 - Mo phong RTL (Icarus Verilog)
    runs-on: ubuntu-latest
    needs: precheck
    steps:
      - uses: actions/checkout@v4

      - name: Cai Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Ghi lai phien ban cong cu
        run: |
          iverilog -V | head -1 | tee tool_versions.txt
          echo "Ngay chay: $(date -Is)" | tee -a tool_versions.txt

      - name: Bien dich va chay testbench
        run: |
          iverilog -g2012 -s b06_tb -o sim.vvp \
            src/project.v \
            test/b06_reference.sv \
            test/tb.v
          vvp sim.vvp | tee simulation.log

      - name: Kiem log - phai co PASS va khong duoc co loi
        run: |
          # Khong tin ma thoat cua vvp: no van tra 0 ngay ca khi testbench
          # bao FAIL. Phai doc chinh noi dung log.
          if grep -qiE "FATAL|mismatch|\bFAIL\b" simulation.log; then
            echo "::error::Testbench bao loi - xem simulation.log"
            exit 1
          fi
          if ! grep -qi "PASS" simulation.log; then
            echo "::error::Khong thay dong PASS nao trong log"
            exit 1
          fi
          echo "Mo phong dat."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mo-phong-${{ env.MA_DE }}
          path: |
            simulation.log
            tool_versions.txt
            *.vcd
          if-no-files-found: warn



  rtl2gds:
    name: 2 - RTL-to-GDSII (LibreLane + sky130A)
    runs-on: ubuntu-latest
    needs: mo-phong
    steps:
      - uses: actions/checkout@v4

      - name: Cai Nix kem bo nho dem nhi phan cua FOSSi
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Lay LibreLane
        run: git clone --depth 1 https://github.com/librelane/librelane ~/librelane

      - name: Chay flow
        run: |
          cd ~/librelane
          nix-shell --run "cd '$GITHUB_WORKSPACE' && librelane --version && librelane '$CONFIG'"

      - name: Kiem SAN PHAM, khong chi kiem ma thoat
        run: |
          set -eu
          GDS=$(find . -type f -name "*.gds" -print -quit)
          MJ=$(find . -type f -name "metrics.json" -print -quit)

          if [ -z "$GDS" ]; then
            echo "::error::Khong sinh duoc file GDS"
            exit 1
          fi

          if [ -z "$MJ" ]; then
            echo "::error::Khong co metrics.json"
            exit 1
          fi

          echo "GDS: $GDS"
          echo "--- Chi so chinh, chep vao bao cao ---"
          python3 .github/doc_metrics.py "$MJ"

      - name: Luu artifact RTL-to-GDSII
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl2gds-${{ env.MA_DE }}
          path: |
            **/runs/**/final/**
            **/runs/**/*.log
            **/runs/**/*.json
            **/runs/**/*.v
            **/runs/**/*.lef
            **/runs/**/*.gds
            **/*.gds
  gl_test:
    name: 3 - Gate-Level Simulation
    runs-on: ubuntu-latest
    needs: rtl2gds

    steps:
      - uses: actions/checkout@v4

      - name: Cai Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Bien dich gate-level netlist
        run: |
          set -eu
          iverilog -g2012 -s b06_tb \
            -o gate_test.vvp \
            test/gate/netlist.v \
            test/gate/sky130_xor3_model.v \
            test/b06_reference.sv \
            test/tb.v

      - name: Chay gate-level test
        run: |
          set -eu
          vvp gate_test.vvp | tee gate_test.log
          grep -q "B06 exhaustive 16-word Hamming(7,4) encoder validation PASS" gate_test.log
          grep -q "B06 extended checks CC-08..CC-12 PASS" gate_test.log

      - name: Luu artifact gate-level test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-test-${{ env.MA_DE }}
          path: |
            gate_test.log
            b06_tb.vcd
          if-no-files-found: warn
