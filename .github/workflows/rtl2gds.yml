# =====================================================================
# EEE703128 - Hamming (7,4) Encoder
# RTL Simulation -> Tiny Tapeout GDS -> Precheck -> Gate-Level Test -> Viewer
# =====================================================================

name: RTL to GDSII & Verification Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MA_DE: B06

jobs:
  mo-phong:
    name: 1 - RTL Simulation (Icarus Verilog)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Record tool versions
        shell: bash
        run: |
          set -euo pipefail
          iverilog -V 2>&1 | head -1 | tee tool_versions.txt
          echo "Run time: $(date -Is)" | tee -a tool_versions.txt

      - name: Compile and run RTL testbench
        shell: bash
        run: |
          set -euo pipefail
          iverilog -g2012 -o sim.vvp \
            src/project.v \
            test/b06_reference.sv \
            test/tb_rtl.v
          vvp sim.vvp | tee simulation.log

      - name: Verify RTL simulation result
        shell: bash
        run: |
          set -euo pipefail

          if grep -qiE 'FATAL|mismatch|FAIL' simulation.log; then
            echo "::error::RTL simulation reported a failure."
            exit 1
          fi

          if ! grep -qi 'PASS' simulation.log; then
            echo "::error::No PASS marker found in simulation.log."
            exit 1
          fi

          echo "RTL simulation passed."

      - name: Upload RTL simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mo-phong-${{ env.MA_DE }}
          path: |
            simulation.log
            tool_versions.txt
            *.vcd
          if-no-files-found: warn

  gds:
    name: 2 - Build GDS with Tiny Tapeout
    runs-on: ubuntu-24.04
    needs: mo-phong

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky25b
        with:
          pdk: sky130A

  precheck:
    name: 3 - Official Tiny Tapeout Precheck
    runs-on: ubuntu-24.04
    needs: gds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run official Tiny Tapeout precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky25b

  gl_test:
    name: 4 - Official Gate-Level Simulation
    runs-on: ubuntu-24.04
    needs: gds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run official Tiny Tapeout gate-level test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky25b

  viewer:
    name: 5 - Official Tiny Tapeout Viewer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: [precheck, gl_test]

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy official Tiny Tapeout viewer
        uses: TinyTapeout/tt-gds-action/viewer@ttsky25b
